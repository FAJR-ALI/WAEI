<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Waei — Hero stories">واعي — قصص الأبطال</title>
    <link rel="icon" href="/img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kids.css">
    <script src="/js/i18n.js"></script>
</head>
<body>
<header class="k-header">
    <a href="/kids" class="k-back">
        <svg aria-hidden="true" class="flip-ltr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        <span data-en="Back to games">رجوع للألعاب</span>
    </a>
    <div class="k-tools">
        <button type="button" class="lang-toggle">English</button>
        <button type="button" class="k-sound" id="speakHero" aria-label="اسمع الكلام بصوت" data-en-aria="Listen">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
        </button>
    </div>
</header>
<main class="k-main"><section class="k-hero"><div class="k-hero-text"><h1 id="heroTitle" data-en="Hero stories">قصص الأبطال</h1></div></section>
    <section id="stories" class="k-card" aria-label="قصص الأبطال" data-en-aria="Hero stories">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
            <h2 data-en="Hero stories">قصص الأبطال</h2>
            <div class="k-chips" id="ageChips" role="group" aria-label="اختر عمرك" data-en-aria="Choose your age">
                <button type="button" class="k-chip" data-age="ALL" aria-pressed="true" data-en="All ages">كل الأعمار</button>
                <button type="button" class="k-chip" data-age="3-5" aria-pressed="false">3 - 5</button>
                <button type="button" class="k-chip" data-age="6-8" aria-pressed="false">6 - 8</button>
                <button type="button" class="k-chip" data-age="9-12" aria-pressed="false">9 - 12</button>
            </div>
        </div>
        <div id="storiesList" class="k-grid"></div>
    </section>

    <p class="k-note" data-en="&lt;strong&gt;Note for parents:&lt;/strong&gt; Kids mode is for learning only. We don&#x27;t ask for video or collect any data about the child. Every AI-written story is reviewed by a specialist before it is published."><strong>ملاحظة للأهل:</strong> وضع الأطفال للتعلم فقط. ما نطلب فيديو ولا نجمع أي بيانات عن الطفل. كل قصة يكتبها الذكاء الاصطناعي يراجعها مختص قبل ما تنشر.</p>
</main>
<script src="/js/api.js"></script>
<script th:inline="none">
    // Read text out loud with the browser's voice (works offline, nothing is sent anywhere)
    function speak(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const voice = new SpeechSynthesisUtterance(text);
        voice.lang = tr("ar-SA", "en-US");
        voice.rate = 0.9;
        window.speechSynthesis.speak(voice);
    }

    document.getElementById("speakHero").addEventListener("click", function () {
        speak(document.getElementById("heroTitle").textContent);
    });


    let allStories = [];
    let selectedAge = "ALL";

    const AGE_LABELS = {
        "3-5": tr("من 3 إلى 5 سنوات", "Ages 3 to 5"),
        "6-8": tr("من 6 إلى 8 سنوات", "Ages 6 to 8"),
        "9-12": tr("من 9 إلى 12 سنة", "Ages 9 to 12")
    };

    async function loadStories() {
        const list = document.getElementById("storiesList");
        list.innerHTML = '<div class="k-loading">' + tr("نجيب القصص...", "Loading stories...") + '</div>';
        try {
            allStories = await apiGet("/kids/stories");
            renderStories();
        } catch (e) {
            list.innerHTML = '<div class="k-empty">' + tr("ما قدرنا نجيب القصص الحين، جرّب بعدين.", "We couldn't load the stories now, try later.") + '</div>';
        }
    }

    function renderStories() {
        const list = document.getElementById("storiesList");
        let stories = allStories;
        if (selectedAge !== "ALL") {
            stories = allStories.filter(function (s) { return s.ageGroup === selectedAge; });
        }
        if (stories.length === 0) {
            list.innerHTML = '<div class="k-empty">' + tr("ما فيه قصص لهذا العمر للحين.", "No stories for this age yet.") + '</div>';
            return;
        }
        let html = "";
        for (const s of stories) {
            html += '<a class="k-story-card" href="/story?id=' + s.id + '">'
                + '<span class="title">' + escapeHtml(s.title) + "</span>"
                + '<span class="meta">' + escapeHtml(s.topic) + " · " + escapeHtml(AGE_LABELS[s.ageGroup] || s.ageGroup) + "</span>"
                + "</a>";
        }
        list.innerHTML = html;
    }

    document.querySelectorAll("#ageChips .k-chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
            selectedAge = chip.dataset.age;
            document.querySelectorAll("#ageChips .k-chip").forEach(function (c) {
                c.setAttribute("aria-pressed", c === chip ? "true" : "false");
            });
            renderStories();
        });
    });


loadStories();
</script>
</body>
</html>
