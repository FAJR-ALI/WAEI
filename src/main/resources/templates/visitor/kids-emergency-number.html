<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Waei — Emergency number">واعي — رقم الطوارئ</title>
    <link rel="icon" href="/img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kids.css?v=art-1">
    <script src="/js/i18n.js"></script>
</head>
<body>
<header class="k-header">
    <a href="/kids" class="k-back">
        <svg aria-hidden="true" class="flip-ltr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        <span data-en="Back to games">رجوع للألعاب</span>
    </a>
    <div class="k-tools">
        <button type="button" class="lang-toggle">English</button>
        <div class="k-stars" id="starsBox" aria-live="polite">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"></path></svg>
            <span id="starsCount">0</span>
        </div>
        <button type="button" class="k-sound" id="speakHero" data-kids-speak=".k-hero-text,#dial > h2,#dial > p" aria-label="اسمع الكلام بصوت" data-en-aria="Listen">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
        </button>
    </div>
</header>
<main class="k-main"><section class="k-hero k-art-hero" data-activity="emergency-number"><div class="k-hero-text"><h1 id="heroTitle" data-en="Emergency number">رقم الطوارئ</h1></div>
        <img class="k-hero-art" src="/img/kids-activities/emergency-number-v1.png" width="1254" height="1254" alt="طفلة تتدرب على هاتف لعبة" data-en-alt="A child practicing with a toy telephone" decoding="async">
    </section>
        <section id="dial" class="k-dial" aria-label="اتصل على الإسعاف" data-en-aria="Call the ambulance">
            <h2 style="font-size: 30px; font-weight: 800" data-en="Call the ambulance">اتصل على الإسعاف</h2>
            <p style="font-size: 19px; font-weight: 600" data-en="Dial the ambulance number">اضغط رقم الإسعاف</p>
            <div class="k-dial-screen" id="dialScreen" aria-live="polite">_ _ _</div>
            <div class="k-keys" id="keys"></div>
            <span id="dialStatus" role="status"></span>
<button type="button" class="k-listen" data-kids-speak="#dialStatus" data-en="🔊 Listen to the result">🔊 اسمع النتيجة</button>
        </section>
    <p class="k-note" data-en="&lt;strong&gt;Note for parents:&lt;/strong&gt; Kids mode is for learning only. We don&#x27;t ask for video or collect any data about the child, and the stars disappear when you close the page. Every AI-written story is reviewed by a specialist before it is published."><strong>ملاحظة للأهل:</strong> وضع الأطفال للتعلم فقط. ما نطلب فيديو ولا نجمع أي بيانات عن الطفل، والنجوم تختفي لما تسكّر الصفحة. كل قصة يكتبها الذكاء الاصطناعي يراجعها مختص قبل ما تنشر.</p>
</main>
<script src="/js/api.js"></script>
<script src="/js/kids-voice.js?v=2"></script>
<script th:inline="none">
    // Stars live only in this page (nothing is saved about the child)
    let stars = 0;

    function addStar() {
        stars++;
        document.getElementById("starsCount").textContent = stars;
        document.getElementById("starsBox").setAttribute("aria-label", tr("عندك " + stars + " نجوم", "You have " + stars + " stars"));
    }




    let dial = "";
    let dialSolved = false;

    function renderKeys() {
        const CLEAR = tr("مسح", "Clear");
        const CALL = tr("اتصل", "Call");
        const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", CLEAR, "0", CALL];
        let html = "";
        for (const k of keys) {
            let cls = "k-key";
            let label = tr("الرقم ", "Number ") + k;
            if (k === CLEAR) { cls += " clear"; label = CLEAR; }
            if (k === CALL) { cls += " call"; label = CALL; }
            html += '<button type="button" class="' + cls + '" data-key="' + k + '" aria-label="' + label + '">' + k + "</button>";
        }
        document.getElementById("keys").innerHTML = html;

        document.querySelectorAll(".k-key").forEach(function (button) {
            button.addEventListener("click", function () {
                pressKey(button.dataset.key);
            });
        });
    }

    function pressKey(key) {
        const status = document.getElementById("dialStatus");
        if (key === tr("مسح", "Clear")) {
            dial = "";
            status.innerHTML = "";
        } else if (key === tr("اتصل", "Call")) {
            if (dial === "997") {
                status.innerHTML = '<span class="k-status" style="background: #16A34A; color: #FFFFFF">' + tr("صح! 997 هو الإسعاف", "Right! 997 is the ambulance") + '</span>';
                if (!dialSolved) {
                    dialSolved = true;
                    addStar();
                }
            } else {
                status.innerHTML = '<span class="k-status" style="background: #FCD34D; color: #451A03">' + tr("قربت! جرّب مرة ثانية", "Almost! Try again") + '</span>';
            }
        } else if (dial.length < 3) {
            dial += key;
            status.innerHTML = "";
        }
        document.getElementById("dialScreen").textContent = dial.length ? dial : "_ _ _";
    }


renderKeys();
</script>
</body>
</html>
