<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#f4f2f8;direction:rtl;font-family:Tahoma,Arial,sans-serif;">
  <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f2f8;">
    <tr>
      <td align="center" style="padding:36px 12px;">
        <table role="presentation" dir="rtl" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e7e1f0;border-radius:16px;overflow:hidden;">
          <tr><td height="6" style="height:6px;background-color:#6d28d9;font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:30px 30px 0;text-align:right;">
              <p style="margin:0 0 16px;color:#7957aa;font-size:13px;font-weight:bold;line-height:1.8;">منصة واعي <span dir="ltr" style="color:#a196b2;">&nbsp; / &nbsp; WAEI</span></p>
              <h1 style="margin:0;color:#35224f;font-family:Tahoma,Arial,sans-serif;font-size:25px;line-height:1.65;font-weight:bold;">{{subject}}</h1>
            </td>
          </tr>
          <tr><td style="padding:22px 30px 0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td height="1" style="background-color:#eee9f4;font-size:0;line-height:0;">&nbsp;</td></tr></table></td></tr>
          <tr>
            <td style="padding:24px 30px 16px;text-align:right;direction:rtl;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:26px 24px 28px;background-color:#faf8fe;border-top:1px solid #eee9f4;">
              <img src="cid:waei-logo" width="72" height="68" alt="شعار واعي" style="display:block;width:72px;height:68px;margin:0 auto 12px;border:0;">
              <p style="margin:0;color:#4d297c;font-family:Tahoma,Arial,sans-serif;font-size:20px;font-weight:bold;line-height:1.8;">واعي <span dir="ltr" style="font-size:14px;font-weight:normal;color:#8c7aab;">&nbsp; WAEI</span></p>
              <p style="margin:5px 0 0;color:#8c819c;font-size:12px;line-height:1.8;">رسالة آلية من منصة واعي</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
