spring.application.name=waei-platform

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/waei_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Enable SQL logging
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}
spring.thymeleaf.cache=false

# Security
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-minutes=480

# Bootstrap platform administrator
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=Platform Administrator

# CORS (empty by default: the API is consumed directly; set origins for browser clients)
app.cors.allowed-origins=${CORS_ORIGINS:}

# Training request lifecycle automation
app.training.status-refresh-ms=60000

# Zoom online meetings
app.zoom.enabled=${ZOOM_ENABLED:true}
app.zoom.initial-delay-ms=5000
app.zoom.refresh-ms=30000
app.zoom.retry-cooldown-ms=300000
app.zoom.batch-size=20
zoom.api.base-url=https://api.zoom.us/v2
zoom.oauth.token-url=https://zoom.us/oauth/token
zoom.account-id=${ZOOM_ACCOUNT_ID:}
zoom.client-id=${ZOOM_CLIENT_ID:}
zoom.client-secret=${ZOOM_CLIENT_SECRET:}
zoom.host-email=${ZOOM_HOST_EMAIL:}
zoom.timezone=${ZOOM_TIMEZONE:Asia/Riyadh}

# Payments
payment.commission-rate-percent=10

# Moyasar (use your sk_test_... key for test mode)
moyasar.api.base-url=https://api.moyasar.com/v1
moyasar.api.secret-key=${MOYASAR_SECRET_KEY:}
moyasar.webhook.secret=${MOYASAR_WEBHOOK_SECRET:}
# The payment id is appended to the success URL as a path segment: /payment/callback/{paymentId}
moyasar.checkout.success-url=${MOYASAR_SUCCESS_URL:http://localhost:8080/payment/callback}
moyasar.checkout.back-url=${MOYASAR_BACK_URL:http://localhost:8080/payment/callback}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-flash-latest
gemini.video.model=${GEMINI_VIDEO_MODEL:gemini-3.5-flash-lite}
gemini.detective.model=${GEMINI_DETECTIVE_MODEL:gemini-3.5-flash-lite}
gemini.drawing.model=${GEMINI_DRAWING_MODEL:gemini-3.5-flash-lite}
gemini.kids.story-model=${GEMINI_KIDS_STORY_MODEL:gemini-3.5-flash-lite}
gemini.summary.model=${GEMINI_SUMMARY_MODEL:gemini-3.5-flash-lite}
gemini.announcement.model=${GEMINI_ANNOUNCEMENT_MODEL:gemini-3.5-flash-lite}
gemini.prep.model=${GEMINI_PREP_MODEL:gemini-3.5-flash-lite}
gemini.tts.model=${GEMINI_TTS_MODEL:gemini-3.8-flash-tts}
gemini.tts.voice=${GEMINI_TTS_VOICE:Kore}

# Video upload size (default is only 1MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Organization registration documents
app.upload.dir=${UPLOAD_DIR:uploads/organization-documents}
app.upload.max-document-size-bytes=10485760

# Training program images
app.program-image.dir=${PROGRAM_IMAGE_DIR:uploads/program-images}
app.program-image.max-size-bytes=5242880


# JavaMailSender sends all emails; n8n only triggers the reminder API.
app.email.enabled=${WAEI_EMAIL_ENABLED:false}
app.email.from=${WAEI_MAIL_FROM:${WAEI_MAIL_USERNAME:}}
spring.mail.host=${WAEI_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${WAEI_MAIL_PORT:587}
spring.mail.username=${WAEI_MAIL_USERNAME:}
spring.mail.password=${WAEI_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.reminders.api-key=${WAEI_REMINDER_API_KEY:}

# WhatsApp payment confirmations (UltraMsg)
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
ultramsg.instance-id=${ULTRAMSG_INSTANCE_ID:}
ultramsg.token=${ULTRAMSG_TOKEN:}
